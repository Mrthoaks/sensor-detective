<!doctype html>
<!-- DATA ARCHITECT: a 5E game for GIS Data Structures (raster vs vector, data types, relational tables,
     storage formats, TINs, quadtrees, compression, indexing, referencing, interoperability).
     Engage → Explore → Explain → Elaborate → Evaluate as one mission with XP, badges and the class leaderboard. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Architect</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f2f7f6; color: #172033; }
.app { max-width: 1100px; margin: auto; padding: 0 22px 60px; }

.hud { position: sticky; top: 0; z-index: 10; background: rgba(242,247,246,.95); backdrop-filter: blur(6px); display: flex; align-items: center; gap: 14px; padding: 12px 0; margin-bottom: 16px; border-bottom: 1px solid #dde8e5; }
.brand { font-weight: bold; font-size: 17px; white-space: nowrap; color: #172033; text-decoration: none; }
.stages { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.st { border: 2px solid #d6e2df; border-radius: 30px; padding: 8px 14px; background: white; font: bold 13px Arial; color: #5d6678; cursor: pointer; }
.st[aria-current="step"] { background: #1f6f6a; border-color: #1f6f6a; color: white; }
.st.done { border-color: #4caf75; }
.st.done::after { content: " ✓"; color: #4caf75; }
.st[aria-current="step"].done::after { color: white; }
.st:disabled { opacity: .45; cursor: not-allowed; }
.xp { background: #172033; color: white; border-radius: 30px; padding: 8px 14px; font: bold 13px Arial; white-space: nowrap; }
.xp b { color: #ffd166; }

header { text-align: center; margin: 20px 0 24px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #1f6f6a; margin-bottom: 10px; }
h1 { font-size: 38px; margin: 0 0 10px; }
.subtitle { max-width: 720px; margin: auto; line-height: 1.6; color: #5d6678; font-size: 17px; }

.panel { background: white; border-radius: 20px; padding: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.06); margin-bottom: 20px; }
.panel h2 { margin: 0 0 6px; font-size: 23px; }
.panel h3 { margin: 18px 0 8px; font-size: 17px; }
.sub { margin: 0 0 16px; color: #6b7487; line-height: 1.55; }
.bridge { display: flex; gap: 15px; align-items: flex-start; background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,.06); border-left: 5px solid #2f8f7f; line-height: 1.6; }
.bridge > span { font-size: 30px; }
.bridge p { margin: 6px 0 0; color: #5d6678; }
.big-q { text-align: center; font-size: 22px; font-weight: bold; color: #1f6f6a; margin: 6px 0 14px; line-height: 1.4; }
.muted { color: #7a8393; font-size: 14px; line-height: 1.5; }

.btn { border: 0; border-radius: 12px; padding: 14px 26px; background: #1f6f6a; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
.btn:hover { opacity: .92; }
.btn:disabled { background: #c3cdd0; cursor: not-allowed; }
.btn.ghost { background: white; color: #1f6f6a; border: 2px solid #d6e2df; }
.btn.small { padding: 9px 14px; font-size: 14px; }
.btn.wide { display: block; width: 100%; max-width: 360px; margin: 22px auto 0; }
button:focus-visible, textarea:focus-visible, input:focus-visible, td[tabindex]:focus-visible, th[tabindex]:focus-visible, tr[tabindex]:focus-visible, svg:focus-visible { outline: 3px solid #172033; outline-offset: 2px; }

textarea { width: 100%; min-height: 96px; border: 2px solid #d6e2df; border-radius: 12px; padding: 12px; font: 15px/1.5 Arial; color: #172033; resize: vertical; }
input[type=text] { border: 2px solid #d6e2df; border-radius: 10px; padding: 10px 12px; font: 15px Arial; width: 100%; max-width: 320px; }

/* predictions */
.pred { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid #eef2f1; }
.pred:last-child { border-bottom: 0; }
.pred p { margin: 0; line-height: 1.5; }
.seg3 { display: flex; gap: 6px; }
.seg3 button { border: 2px solid #d6e2df; border-radius: 10px; padding: 8px 12px; background: #f7faf9; font: bold 13px Arial; color: #5d6678; cursor: pointer; }
.seg3 button[aria-pressed="true"] { background: #1f6f6a; border-color: #1f6f6a; color: white; }

/* messy spreadsheet */
.sheet { overflow-x: auto; border: 1px solid #cfd8d6; border-radius: 10px; }
.sheet .fname { background: #217346; color: white; font: bold 13px Arial; padding: 8px 12px; }
.sheet table { border-collapse: collapse; width: 100%; font: 14px "Courier New", monospace; }
.sheet th, .sheet td { border: 1px solid #dfe5e3; padding: 9px 10px; text-align: left; white-space: nowrap; cursor: pointer; }
.sheet th { background: #eef3f1; font-weight: bold; }
.sheet td:hover, .sheet th:hover { background: #fff8dd; }
.sheet .hit { background: #fde3df !important; box-shadow: inset 0 0 0 2px #d9695a; }
.sheet .ok { background: #eef7f0; }
.found { display: grid; gap: 8px; margin-top: 14px; }
.found div { background: #fff8e8; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.count { font-weight: bold; color: #1f6f6a; }

/* options */
.q { font-size: 17px; font-weight: bold; line-height: 1.45; margin: 0 0 12px; }
.qq { margin-bottom: 18px; padding-bottom: 6px; }
.qq + .qq { border-top: 1px solid #eef2f1; padding-top: 16px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 2px solid #d6e2df; border-radius: 13px; padding: 12px 14px; background: #f7faf9; font: 15px/1.4 Arial; color: #172033; cursor: pointer; }
.opt b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: white; border: 2px solid #d6e2df; font-size: 12px; flex: none; }
.opt:hover:not(:disabled) { border-color: #2f8f7f; }
.opt.right { background: #edf8f1; border-color: #4caf75; }
.opt.wrong { background: #fdf0ee; border-color: #d9695a; }
.opt:disabled { cursor: default; }
.feedback { margin-top: 12px; padding: 14px 16px; border-radius: 13px; background: #edf8f1; border: 1px solid #b9dfc6; line-height: 1.55; font-size: 15px; }
.feedback.bad { background: #fdf0ee; border-color: #f0c2bb; }
.say { margin-top: 14px; padding: 14px 18px; border-left: 4px solid #2f8f7f; background: #f7faf9; line-height: 1.55; border-radius: 0 10px 10px 0; }

/* explore */
.tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
.tab { border: 2px solid #d6e2df; border-radius: 14px; padding: 10px 6px; background: white; font: bold 13px Arial; color: #5d6678; cursor: pointer; position: relative; }
.tab .ic { display: block; font-size: 22px; margin-bottom: 3px; }
.tab[aria-pressed="true"] { background: #1f6f6a; border-color: #1f6f6a; color: white; }
.tab.solved::after { content: "✓"; position: absolute; top: -7px; right: -6px; background: #4caf75; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 20px; }
.lab { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; align-items: start; }
.viz svg { display: block; width: 100%; max-width: 480px; height: auto; margin: auto; border-radius: 14px; }
.ctrls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
.tg { border: 2px solid #d6e2df; border-radius: 30px; padding: 8px 14px; background: white; font: bold 13px Arial; color: #5d6678; cursor: pointer; }
.tg[aria-pressed="true"] { background: #172033; border-color: #172033; color: white; }
.slider { display: flex; align-items: center; gap: 10px; width: 100%; font-weight: bold; font-size: 14px; }
.slider input { flex: 1; accent-color: #1f6f6a; }
.readout { margin-top: 12px; border-radius: 13px; background: #172033; color: #dfe9e7; padding: 13px 15px; font: 13px/1.6 "Courier New", monospace; }
.readout b { color: #ffd166; }
.clues h3 { margin: 0 0 10px; font-size: 15px; }
.clue { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #f7faf9; margin-bottom: 8px; font-size: 14px; line-height: 1.45; color: #9aa3b2; }
.clue strong { color: #172033; white-space: nowrap; }
.clue.got { background: #fff8e8; color: #172033; }
.need { font-size: 14px; margin: 8px 0 0; color: #5d6678; }
.need span { margin-right: 12px; }

.mini { border-collapse: collapse; width: 100%; font-size: 14px; }
.mini caption { text-align: left; font-weight: bold; padding-bottom: 6px; }
.mini th, .mini td { border: 1px solid #e1e8e6; padding: 7px 8px; text-align: left; }
.mini th { background: #eef4f2; font-size: 13px; }
.mini tr[tabindex] { cursor: pointer; }
.mini tr[tabindex]:hover td { background: #f6fbfa; }
.mini tr.hl td, .mini tr.hl:hover td { background: #fff3c4; }
.mini .pk { color: #1f6f6a; font-weight: bold; }
.mini .fk { color: #b0563f; font-weight: bold; }
.ftype { display: grid; gap: 10px; }
.frow { border: 2px solid #e1e8e6; border-radius: 12px; padding: 10px 12px; }
.frow.right { border-color: #4caf75; background: #f3fbf6; }
.frow.wrong { border-color: #d9695a; background: #fdf4f2; }
.frow .fn { font: bold 14px "Courier New", monospace; }
.frow .ex { color: #6b7487; font-size: 13px; margin-left: 6px; }
.frow .ch { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.frow .ch button { border: 2px solid #d6e2df; border-radius: 8px; padding: 5px 8px; background: white; font: bold 12px Arial; color: #5d6678; cursor: pointer; }
.frow .ch button[aria-pressed="true"] { background: #1f6f6a; border-color: #1f6f6a; color: white; }
.frow .why { font-size: 13px; margin-top: 6px; line-height: 1.45; color: #3f4a5c; }

/* explain */
.etabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.etab { border: 2px solid #d6e2df; border-radius: 30px; padding: 9px 14px; background: white; font: bold 13px Arial; color: #5d6678; cursor: pointer; }
.etab[aria-pressed="true"] { background: #1f6f6a; border-color: #1f6f6a; color: white; }
.etab.solved { border-color: #4caf75; }
.etab.solved::after { content: " ✓"; color: #4caf75; }
.etab[aria-pressed="true"].solved::after { color: white; }
.tbl { overflow-x: auto; }
.cmp { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0 14px; }
.cmp th, .cmp td { border-bottom: 1px solid #e6ecea; padding: 9px 10px; text-align: left; vertical-align: top; line-height: 1.45; }
.cmp th { color: #1f6f6a; font-size: 13px; background: #f3f8f7; }
.cmp code, .ex-body code { background: #eef4f2; padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.ex-body p, .ex-body li { line-height: 1.6; }
.ex-body ul { padding-left: 20px; }
.key { background: #fff8e8; border-radius: 12px; padding: 12px 14px; margin: 12px 0; line-height: 1.55; }
.check { border-top: 2px dashed #d6e2df; margin-top: 18px; padding-top: 16px; }

/* elaborate */
.dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: #d6e2df; }
.dots span.on { background: #1f6f6a; }
.dots span.ok { background: #4caf75; }
.dots span.meh { background: #e4b04a; }
.case-ic { font-size: 44px; text-align: center; }
.story { font-size: 17px; line-height: 1.6; text-align: center; max-width: 680px; margin: 6px auto 18px; }

/* evaluate */
.bar { height: 10px; background: #dfe9e6; border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.bar div { height: 100%; background: #2f8f7f; transition: .4s ease; }
.step { font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #1f6f6a; margin-bottom: 8px; }
.scale { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
.scale button { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #d6e2df; background: white; font: bold 17px Arial; cursor: pointer; }
.scale button[aria-pressed="true"] { background: #1f6f6a; border-color: #1f6f6a; color: white; }
.ends { display: flex; justify-content: space-between; max-width: 300px; margin: 0 auto 18px; font-size: 13px; color: #7a8393; }
.tv { border-collapse: collapse; width: 100%; font-size: 14px; }
.tv th, .tv td { border-bottom: 1px solid #e6ecea; padding: 9px 8px; text-align: left; vertical-align: top; line-height: 1.45; }
.cert { text-align: center; border: 3px double #2f8f7f; border-radius: 18px; padding: 26px 20px; }
.cert .medal { font-size: 60px; }
.cert h2 { font-size: 30px; margin: 4px 0; }
.cert .score { font-size: 22px; font-weight: bold; color: #1f6f6a; margin: 6px 0; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
.badge { background: #e3f1ee; color: #1f5a55; border-radius: 30px; padding: 8px 12px; font-weight: bold; font-size: 14px; }
.badge.off { background: #eef0f4; color: #a3abb9; }
.rev { list-style: none; padding: 0; columns: 2; text-align: left; max-width: 560px; margin: 14px auto 0; font-size: 14px; line-height: 1.8; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
.finish { text-align: center; }
.finish .fi { font-size: 52px; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 80px); background: #172033; color: white; padding: 12px 18px; border-radius: 30px; font-weight: bold; opacity: 0; transition: .3s ease; z-index: 40; }
.toast b { color: #ffd166; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.foot { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
.foot button, .foot a { background: none; border: 0; color: #8992a5; text-decoration: underline; font: 13px Arial; cursor: pointer; }

@media (max-width: 860px) {
  .lab { grid-template-columns: 1fr; }
  .tabs { grid-template-columns: repeat(3, 1fr); }
  .hud { flex-wrap: wrap; }
  .stages { order: 3; flex-basis: 100%; }
}
@media (max-width: 560px) {
  h1 { font-size: 27px; }
  .panel { padding: 18px; }
  .pred { grid-template-columns: 1fr; }
  .st { padding: 7px 10px; font-size: 12px; }
  .rev { columns: 1; }
}
@media print { .hud, .foot, .row, .toast { display: none !important; } body { background: white; } }
</style>
</head>

<div class="app">
  <div class="hud">
    <a class="brand" href="index.html">🏗️ Data Architect</a>
    <nav class="stages" id="stages" aria-label="5E stages"></nav>
    <div class="xp">XP <b id="xp">0</b></div>
  </div>
  <main id="stage"></main>

    <button onclick="resetAll(this)">Reset progress</button>

  </div>

<script>
/* =====================================================================
   CONTENT
   ===================================================================== */
const STAGES = [
  { id: "engage", n: "1 Engage" }, { id: "explore", n: "2 Explore" }, { id: "explain", n: "3 Explain" },
  { id: "elaborate", n: "4 Elaborate" }, { id: "evaluate", n: "5 Evaluate" }
];

/* Engage: the messy spreadsheet. Cells with a problem id are the hidden problems. */
const MESS_HEAD = [["Site"], ["Location"], ["Water Depth (m)", "p1"], ["Observers"], ["Visit_Date"], ["ZIP"]];
const MESS_ROWS = [
  [["Site A"], ["34.05, -118.24"], ["4"], ["Liam"], ["2016-01-14"], ["02134"]],
  [["Site B"], ["34.07, -118.26"], ["17 ft", "p2"], ["Sarah"], ["Dec 7 2015", "p7"], ["2134", "p6"]],
  [["Site B"], ["34.0701, -118.2602", "p4"], ["N/A", "p3"], ["Kelly"], ["2015-11-18"], ["02134"]],
  [["Site C"], ["34.09, -118.21"], ["8"], ["Liam, Sarah", "p5"], ["2015-11-21"], ["02134"]]
];
const PROBLEMS = {
  p1: "🏷️ <strong>Field name with spaces and brackets.</strong> Most databases can't use spaces in field names. Better: <code>Water_Depth_m</code> or <code>WaterDepthM</code>.",
  p2: "🔢 <strong>“17 ft” is text in a number column, in feet instead of metres.</strong> Now nobody can average the depths. Numbers belong in a number field, in one unit.",
  p3: "❓ <strong>“N/A” typed as text.</strong> Does it mean unknown or zero? An unknown value should be a true blank, called <em>Null</em>.",
  p4: "📍 <strong>Site B's location is typed again, slightly differently.</strong> Repeating the location on every visit makes overlapping duplicate points. Store each site once and link visits to it.",
  p5: "👥 <strong>Two observers squeezed into one cell.</strong> You can't search, count or join people stored this way.",
  p6: "0️⃣ <strong>The ZIP code lost its leading zero.</strong> It was stored as a number. Codes are labels, not amounts, so store them as text.",
  p7: "📅 <strong>A date typed in a different style.</strong> A real date field keeps dates consistent, sortable and searchable."
};
const NEED_FOUND = 5;

const PREDS = [
  { s: "A satellite photo and a map of property lines are stored the same way inside a GIS.", truth: "Disagree", why: "The photo is a <em>raster</em> (a grid of cells). Property lines are <em>vector</em> polygons built from x,y points." },
  { s: "A blank cell and a zero mean the same thing in a data table.", truth: "Disagree", why: "Blank (Null) means <em>we don't know</em>. Zero means <em>we measured it and it is zero</em>." },
  { s: "Keeping all the data in one big table is the best design.", truth: "Disagree", why: "One big table repeats information, which causes errors. Good designs split data into related tables and join them with keys." },
  { s: "A shapefile is just one file.", truth: "Disagree", why: "A shapefile is a set of files that travel together: <code>.shp</code>, <code>.shx</code>, <code>.dbf</code>, <code>.prj</code> and often more." },
  { s: "An index makes a search faster without changing the answer.", truth: "Agree", why: "Like the index in a book, it lets the GIS skip data that can't match. Same result, much less checking." },
  { s: "Raster data is always less accurate than vector data.", truth: "Disagree", why: "It depends. A raster's detail depends on its cell size, and rasters are the better fit for continuous things like elevation. Vector shines for exact edges." }
];
const MISSION_Q = "How should Riverbend store its map data so it is accurate, small, fast to search and easy to share?";

/* ---------- Explore stations ---------- */
const LAKE = [[60,40],[120,28],[175,52],[208,104],[196,160],[160,202],[104,212],[58,186],[34,140],[40,84]];
const CS = [60, 40, 30, 20, 10, 5];
const TYPES = ["Short integer", "Long integer", "Double", "Text", "Date"];
const FIELDS = [
  { f: "Slope_Deg", ex: "whole degrees, 0 to 90", a: 0, why: "Small whole numbers fit in a short integer (−32,768 to 32,767), which uses half the space of a long integer." },
  { f: "Population", ex: "8,400,000 people", a: 1, why: "Too big for a short integer. A long integer holds whole numbers up to about 2.1 billion." },
  { f: "Water_Depth_m", ex: "2.37", a: 2, why: "It has decimals, so it needs a floating-point type. A double is the most precise." },
  { f: "ZIP_Code", ex: "02134", a: 3, why: "A ZIP code is a label, not an amount (you never add two ZIP codes). As a number it would lose its leading zero." },
  { f: "Inspected_On", ex: "2016-01-14", a: 4, why: "A date type lets you sort and filter by time. Avoid naming a field just “Date”: it's a reserved word in many databases." },
  { f: "Land_Cover", ex: "Water, Vegetation, Pavement", a: 3, why: "Category names are text." }
];
const SITES = [[1, "Site A"], [2, "Site B"], [3, "Site C"]];
const OBS = [[1, 1, 4, 12, "2016-01-14"], [2, 2, 17, 8, "2015-12-07"], [3, 3, 8, 7, "2015-11-18"], [4, 2, 13, 11, "2015-11-21"]];
const QG = ["33332222", "33332222", "33332222", "33332222", "33111111", "33111111", "11231111", "11321111"].map(r => r.split("").map(Number));
const LC = { 1: ["#b9bec7", "Pavement"], 2: ["#6f9fd8", "Water"], 3: ["#7cb86a", "Vegetation"] };

const STATIONS = [
  { id: "A", ic: "🔲", name: "Grid vs Shape", clue: "Raster = a grid of cells with one value each, covering the whole area (great for continuous data like elevation). Vector = x,y points, lines and polygons with exact edges (great for discrete features). Halve the cell size and you store 4× as many cells.",
    intro: "Riverbend Lake is stored two ways. Slide the cell size and switch between raster and vector. Watch the number of stored values and the area error.",
    qs: [
      { q: "You change the cell size from 20 m to 10 m. How many cells does the GIS now store for the same area?", o: ["The same number", "2 times as many", "4 times as many", "Half as many"], a: 2, why: "Halving the cell size halves both the width and the height of each cell, so every old cell becomes 2 × 2 = 4 new cells. More detail costs storage.", hint: "Try 20 m, then 10 m, and compare the cell counts in the readout." },
      { q: "Which structure records the lake's exact shoreline with the fewest stored numbers?", o: ["A raster with 5 m cells", "A raster with 60 m cells", "A vector polygon", "A multi-band raster"], a: 2, why: "The polygon stores only the x,y vertices along the edge: 10 points = 20 numbers. Even 5 m cells need 2,304 values and still have stair-step edges." },
      { q: "Ground elevation changes smoothly everywhere across the county. Which structure fits that best?", o: ["A raster, because every cell holds a value and the grid covers the whole area", "One vector point at city hall", "A single polygon", "A text field"], a: 0, why: "Continuous data (elevation, temperature, rainfall) suits rasters, because a raster covers the entire area with values. Vectors suit discrete things with clear edges." }
    ] },
  { id: "B", ic: "🔢", name: "Field Types", clue: "The data type decides what math is possible and how much storage is used: short or long integers for whole numbers, float or double for decimals, text for labels and codes, date for time. Null means unknown, not zero.",

/* geometry */
function pip(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function polyArea(p) { let a = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]); return Math.abs(a / 2); }
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function ramp(t) {
  const stops = [[0, [207, 227, 181]], [.35, [168, 196, 122]], [.65, [201, 168, 107]], [1, [139, 94, 60]]];
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], k = (t - t0) / (t1 - t0);
    return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k)).join(",")})`;
  }
  return "rgb(139,94,60)";
}
/* Bowyer–Watson Delaunay triangulation */
function delaunay(pts) {
  const P = pts.concat([[-2000, -2000], [2240, -2000], [120, 2400]]), n = pts.length;
  const circ = t => {
    const [a, b, c] = t.map(i => P[i]);
    const d = 2 * (a[0] * (b[1] - c[1]) + b[0] * (c[1] - a[1]) + c[0] * (a[1] - b[1]));
    const A = a[0] ** 2 + a[1] ** 2, B = b[0] ** 2 + b[1] ** 2, C = c[0] ** 2 + c[1] ** 2;
    const ux = (A * (b[1] - c[1]) + B * (c[1] - a[1]) + C * (a[1] - b[1])) / d;
    const uy = (A * (c[0] - b[0]) + B * (a[0] - c[0]) + C * (b[0] - a[0])) / d;
    return [ux, uy, (a[0] - ux) ** 2 + (a[1] - uy) ** 2];
  };
  let tris = [[n, n + 1, n + 2]];
  for (let i = 0; i < n; i++) {
    const p = P[i], bad = [], good = [];
    tris.forEach(t => { const [ux, uy, r2] = circ(t); ((p[0] - ux) ** 2 + (p[1] - uy) ** 2 < r2 ? bad : good).push(t); });
    const edges = [];
    bad.forEach(t => [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]].forEach(e => {
      const k = edges.findIndex(f => (f[0] === e[1] && f[1] === e[0]) || (f[0] === e[0] && f[1] === e[1]));
      if (k >= 0) edges.splice(k, 1); else edges.push(e);
    }));
    tris = good.concat(edges.map(e => [e[0], e[1], i]));
  }
  return tris.filter(t => t.every(i => i < n));
}
const zHill = (x, y) => 8 + 72 * Math.exp(-((x - 165) ** 2 + (y - 110) ** 2) / (2 * 30 ** 2));
const TIN_PTS = (() => {
  const p = [[0, 0], [240, 0], [0, 240], [240, 240], [55, 50], [45, 178], [100, 118], [122, 18], [112, 226], [18, 108]];
  p.push([165, 110]);

  return p.map(([x, y]) => [Math.round(x * 10) / 10, Math.round(y * 10) / 10]);
})();

/* quadtree blocks for the land-cover grid */
function qtBlocks(maxDepth) {
  const out = [];
  (function split(r, c, size, depth) {
    const v = QG[r][c];
    let uniform = true;
    for (let i = r; i < r + size && uniform; i++) for (let j = c; j < c + size; j++) if (QG[i][j] !== v) { uniform = false; break; }
    if (uniform || size === 1 || depth === maxDepth) { out.push({ r, c, size, uniform }); return; }
    const h = size / 2;
    split(r, c, h, depth + 1); split(r, c + h, h, depth + 1); split(r + h, c, h, depth + 1); split(r + h, c + h, h, depth + 1);
  })(0, 0, 8, 0);
  return out;
}
function rle(row) { const out = []; row.forEach(v => { const l = out[out.length - 1]; if (l && l[0] === v) l[1]++; else out.push([v, 1]); }); return out; }

function vizA() {
  const cs = CS[S.a.i], n = 240 / cs, view = S.a.view;
  if ($("csv")) $("csv").textContent = cs + " m";
  let cells = "", cnt = 0;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const inn = pip(c * cs + cs / 2, r * cs + cs / 2, LAKE); if (inn) cnt++;
    if (view !== "vector") cells += `<rect x="${c * cs}" y="${r * cs}" width="${cs}" height="${cs}" fill="${inn ? "#4a90c2" : "#dfe9d6"}" stroke="#fff" stroke-width="${cs >= 10 ? .7 : .25}"/>`;
  }
  const pts = LAKE.map(p => p.join(",")).join(" ");
  const poly = view === "raster" ? "" : `<polygon points="${pts}" fill="${view === "vector" ? "#4a90c2" : "none"}" stroke="${view === "vector" ? "#1d5d8c" : "#d9384a"}" stroke-width="2.5" ${view === "both" ? 'stroke-dasharray="6 4"' : ""}/>` + LAKE.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="#172033"/>`).join("");
  const truth = polyArea(LAKE), est = cnt * cs * cs, err = (est - truth) / truth * 100;
  const svg = `<svg viewBox="0 0 240 240" role="img" aria-label="Riverbend Lake stored as ${view}"><rect width="240" height="240" fill="#dfe9d6"/>${cells}${poly}</svg>`;
  const rRead = `RASTER · cell size <b>${cs} m</b> · grid <b>${n} × ${n} = ${(n * n).toLocaleString()}</b> stored values<br>lake cells: ${cnt} → area ≈ <b>${est.toLocaleString()} m²</b> (error ${err >= 0 ? "+" : ""}${err.toFixed(1)}%)`;
  const vRead = `VECTOR · <b>${LAKE.length} vertices</b> = ${LAKE.length * 2} stored numbers (x,y)<br>exact area = <b>${Math.round(truth).toLocaleString()} m²</b> · edges are exact at any zoom`;
  return svg + `<div class="readout">${view === "vector" ? vRead : view === "raster" ? rRead : rRead + "<br>" + vRead}</div>`;
}

function pickType(i, k) { S.b.pick[i] = k; S.b.checked = false; save(); drawViz(); }
function checkTypes() {

/* Station C: keys & joins */
function vizC() {
  const sel = S.c.sel;
  const siteHL = id => sel && ((sel.t === "site" && sel.id === id) || (sel.t === "obs" && OBS.find(o => o[0] === sel.id)[1] === id));
  const obsHL = o => sel && ((sel.t === "obs" && sel.id === o[0]) || (sel.t === "site" && sel.id === o[1]));

    if (sel.t === "site") joined = `<b>${rows.length}</b> observation${rows.length === 1 ? "" : "s"} relate to this site:<br>` + joined;
  }
  return `<table class="mini"><caption>Sites (has the location)</caption><thead><tr><th class="pk">ID 🔑</th><th>Site_Name</th><th>Shape</th></tr></thead><tbody>
    ${SITES.map(s => `<tr tabindex="0" ${key} class="${siteHL(s[0]) ? "hl" : ""}" onclick="S.c.sel={t:'site',id:${s[0]}};save();drawViz()"><td class="pk">${s[0]}</td><td>${s[1]}</td><td>⬢ point</td></tr>`).join("")}</tbody></table>

    ${OBS.map(o => `<tr tabindex="0" ${key} class="${obsHL(o) ? "hl" : ""}" onclick="S.c.sel={t:'obs',id:${o[0]}};save();drawViz()"><td class="pk">${o[0]}</td><td class="fk">${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${o[4]}</td></tr>`).join("")}</tbody></table>
    <div class="readout">${joined}</div>`;

/* Station D: quadtree + RLE */
function vizD() {
  const cs = 30, blocks = qtBlocks(S.d.depth), full = qtBlocks(3).length;
  let cells = "";
  QG.forEach((row, r) => row.forEach((v, c) => {
    cells += `<rect x="${c * cs}" y="${r * cs}" width="${cs}" height="${cs}" fill="${LC[v][0]}" stroke="#ffffff88" stroke-width=".8" onclick="S.d.row=${r};save();drawViz()" style="cursor:pointer"/>` +
      `<text x="${c * cs + 15}" y="${r * cs + 19}" text-anchor="middle" font-size="12" font-family="Arial" fill="#172033" pointer-events="none">${v}</text>`;
  }));
  const bl = blocks.map(b => `<rect x="${b.c * cs + 1.5}" y="${b.r * cs + 1.5}" width="${b.size * cs - 3}" height="${b.size * cs - 3}" fill="none" stroke="${b.uniform ? "#172033" : "#d9384a"}" stroke-width="${b.uniform ? 3 : 2.5}" ${b.uniform ? "" : 'stroke-dasharray="6 4"'} pointer-events="none"/>`).join("");
  const rowHL = `<rect x="0" y="${S.d.row * cs}" width="240" height="${cs}" fill="none" stroke="#ffd166" stroke-width="3" pointer-events="none"/>`;
  const runs = rle(QG[S.d.row]), totalRuns = QG.reduce((s, r) => s + rle(r).length, 0);
  const mixed = blocks.filter(b => !b.uniform).length;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="8 by 8 land cover grid">${cells}${bl}${rowHL}</svg>
    <div class="readout">QUADTREE · level ${S.d.depth} · <b>${blocks.length}</b> blocks ${mixed ? `(<span style="color:#ff8f8f">${mixed} still mixed: press Split</span>)` : `· fully split ✔`} · raw grid: 64 cells<br>
    RLE · row ${S.d.row + 1}: ${QG[S.d.row].join(" ")} → <b>${runs.map(r => `(${r[0]},${r[1]})`).join("")}</b> = ${runs.length * 2} numbers instead of 8<br>
    whole grid with RLE: ${totalRuns * 2} numbers instead of 64${S.d.depth === 3 ? ` · quadtree: ${full} blocks` : ""}</div>`;
}

/* Station E: DEM vs TIN */
function vizE() {
  let body = "", read;
  if (S.e.view === "dem") {
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const z = zHill(c * 30 + 15, r * 30 + 15);
      body += `<rect x="${c * 30}" y="${r * 30}" width="30" height="30" fill="${ramp((z - 8) / 72)}" stroke="#ffffff99" stroke-width=".8"/><text x="${c * 30 + 15}" y="${r * 30 + 19}" text-anchor="middle" font-size="10" font-family="Arial" fill="#172033">${Math.round(z)}</text>`;
    }
    read = `DEM · <b>8 × 8 = 64</b> elevation values (one per 30 m cell)<br>Same spacing on the flat valley (west) and the steep hill (east).`;
  } else {
    TIN_TRIS.forEach(t => {
      const [a, b, c] = t.map(i => TIN_PTS[i]), cx = (a[0] + b[0] + c[0]) / 3, cy = (a[1] + b[1] + c[1]) / 3;
      body += `<polygon points="${[a, b, c].map(p => p.join(",")).join(" ")}" fill="${ramp((zHill(cx, cy) - 8) / 72)}" stroke="#172033" stroke-width=".8" stroke-opacity=".55"/>`;
    });
    body += TIN_PTS.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#172033"/>`).join("");
    read = `TIN · <b>${TIN_PTS.length} points</b> (x, y, z) → <b>${TIN_TRIS.length} triangles</b><br>Points crowd onto the hill where the slope changes. The flat valley needs only a few big triangles.`;
  }
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Hill 42 as ${S.e.view === "dem" ? "a DEM raster" : "a TIN"}">${body}</svg>
    <p class="muted" style="text-align:center;margin:8px 0 0">Colour = elevation: <span style="color:#8aa86a">■</span> low valley → <span style="color:#8b5e3c">■</span> hilltop</p>
    <div class="readout">${read}</div>`;
}

/* Station F: spatial index search */
function vizF() {
  const R = 34, q = S.f.q, idx = S.f.idx;
  let checked = new Set(), found = new Set(), cellsSearched = [];
  if (q) {
    if (idx) {
      const c0 = Math.max(0, Math.floor((q[0] - R) / 60)), c1 = Math.min(3, Math.floor((q[0] + R) / 60));
      const r0 = Math.max(0, Math.floor((q[1] - R) / 60)), r1 = Math.min(3, Math.floor((q[1] + R) / 60));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) cellsSearched.push([r, c]);
      HYD.forEach((h, i) => { const c = Math.floor(h[0] / 60), r = Math.floor(h[1] / 60); if (r >= r0 && r <= r1 && c >= c0 && c <= c1) checked.add(i); });
    } else HYD.forEach((_, i) => checked.add(i));
    checked.forEach(i => { if (Math.hypot(HYD[i][0] - q[0], HYD[i][1] - q[1]) <= R) found.add(i); });
  }
  const grid = idx ? [60, 120, 180].map(v => `<line x1="${v}" y1="0" x2="${v}" y2="240" stroke="#1f6f6a" stroke-width="1.2"/><line x1="0" y1="${v}" x2="240" y2="${v}" stroke="#1f6f6a" stroke-width="1.2"/>`).join("") : "";
  const hl = cellsSearched.map(([r, c]) => `<rect x="${c * 60}" y="${r * 60}" width="60" height="60" fill="#ffd166" fill-opacity=".35"/>`).join("");
  const dots = HYD.map((h, i) => found.has(i) ? `<circle cx="${h[0]}" cy="${h[1]}" r="5" fill="#d9384a" stroke="#fff" stroke-width="1.5"/>`
    : checked.has(i) ? `<circle cx="${h[0]}" cy="${h[1]}" r="4" fill="#fff" stroke="#e08a1e" stroke-width="2.2"/>`
    : `<circle cx="${h[0]}" cy="${h[1]}" r="3.5" fill="#8a94a6"/>`).join("");
  const ring = q ? `<circle cx="${q[0]}" cy="${q[1]}" r="${R}" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="5 4"/>` : "";
  const read = q ? `SEARCH · index <b>${idx ? "ON" : "OFF"}</b>${idx ? ` · looked in ${cellsSearched.length} of 16 grid cells` : ""}<br>hydrants checked: <b>${checked.size} of 48</b> · found nearby: <b>${found.size}</b>`
    : "Click anywhere on the map to search for hydrants near that spot.";
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Map of 48 hydrants; click to search" onclick="clickF(evt)" style="cursor:crosshair"><rect width="240" height="240" fill="#e8efe9"/>
    <path d="M0 150 C60 130 100 175 160 150 S 220 120 240 130" fill="none" stroke="#9cc3e6" stroke-width="10"/>${hl}${grid}${dots}${ring}</svg>
    <p class="muted" style="text-align:center;margin:8px 0 0"><span style="color:#d9384a">●</span> found · <span style="color:#e08a1e">○</span> checked, too far · <span style="color:#8a94a6">●</span> skipped</p>
    <div class="readout">${read}</div>`;
}
function clickF(e) {
  const b = e.currentTarget.getBoundingClientRect();
  S.f.q = [(e.clientX - b.left) / b.width * 240, (e.clientY - b.top) / b.height * 240];
  const k = S.f.idx ? "on" : "off", first = !S.f.ran[k];
  S.f.ran[k] = true; save();
  if (first) render(true); else drawViz();
}

      <button class="btn ghost" onclick="window.print()">🖨️ Print certificate</button>

      <button class="btn ghost" onclick="S.ev=Object.assign(fresh().ev,{name:S.ev.name});save();renderEvaluate()">Retake evaluation</button>
    </div>`;
}

</script>
